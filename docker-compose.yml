services:
  # Every port below is bound to 127.0.0.1 only — none of these services has its own
  # authentication that's safe to expose beyond the host (NATS ships with no auth unless
  # NATS_TOKEN is set below; Grafana/Prometheus/Loki have no network-level access control
  # of their own). Put a reverse proxy + firewall in front for anything reachable from
  # outside this host; see AGENTS.md / the production deployment guide for the hardened
  # override. Override POSTGRES_PASSWORD, NATS_TOKEN and GRAFANA_ADMIN_PASSWORD via a
  # gitignored .env file (see .env.example) — the defaults below are for local dev only.
  trade-db:
    image: postgres:16-alpine
    container_name: trade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: trade-nats
    restart: unless-stopped
    command: ["-js", "--auth", "${NATS_TOKEN:-devtoken-change-me}"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  trade-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-service
    restart: unless-stopped
    depends_on:
      trade-db:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      NATS_SERVERS: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-devtoken-change-me}
      DATABASE_URL: postgresql+asyncpg://trade:${POSTGRES_PASSWORD:-tradepass}@trade-db:5432/trade
      HEALTH_REQUIRE_WS: "0"
    ports:
      - "127.0.0.1:8000:8000"

  loki:
    image: grafana/loki:3.1.0
    container_name: trade-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:3.1.0
    container_name: trade-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: trade-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./src/Nightwatch/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.4
    container_name: trade-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  trade-db-data:
  grafana-data:

services:
  trade-db:
    image: postgres:16-alpine
    container_name: trade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: tradepass
    ports:
      - "5432:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: trade-nats
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  trade-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-service
    restart: unless-stopped
    depends_on:
      trade-db:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      LOG_LEVEL: INFO
      NATS_SERVERS: nats://nats:4222
      DATABASE_URL: postgresql+asyncpg://trade:tradepass@trade-db:5432/trade
      HEALTH_REQUIRE_WS: "0"
    ports:
      - "8000:8000"

volumes:
  trade-db-data:

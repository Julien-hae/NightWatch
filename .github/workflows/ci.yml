name: CI
permissions:
  contents: read
on: [push, pull_request]
jobs:
  container-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nightwatch:scan .
      # Report-only: base-image OS packages and Python dependencies will always carry
      # some HIGH/CRITICAL CVEs at any given time, many with no upstream fix yet, so
      # failing the build on every one of them would make CI red for reasons unrelated
      # to code changes. Findings are uploaded to the repo's Security tab (SARIF) for
      # visibility and tracking instead of gating merges.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nightwatch:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry && poetry install
      - run: poetry run ruff check .
      - run: poetry run mypy src/
      - run: poetry run coverage run -m xmlrunner discover --output-file junittest.xml
      - run: poetry run coverage xml
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trade
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: tradepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade -d trade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://trade:tradepass@localhost:5432/trade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry && poetry install
      - run: |
          # Install nats-server for integration tests
          wget https://github.com/nats-io/nats-server/releases/download/v2.10.7/nats-server-v2.10.7-linux-amd64.tar.gz
          tar xzf nats-server-*.tar.gz
          sudo mv nats-server-*/nats-server /usr/local/bin/
      - run: RUN_INTEGRATION=1 poetry run coverage run -m xmlrunner discover --output-file junittest.xml -s tests/Nightwatch -p "test_integration*.py"
      - run: poetry run coverage xml
